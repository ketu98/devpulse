name: DevPulse Autonomous Publisher

on:
  schedule:
    # Three time windows per day. DevPulse chooses exactly 3-4 random day/slot
    # combinations each ISO week.
    - cron: "17 4 * * *"
    - cron: "43 10 * * *"
    - cron: "29 15 * * *"

  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force a publication on this run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: devpulse-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid

          for i in {1..30}; do
            if curl -s http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready."
              break
            fi
            sleep 2
          done

      - name: Pull Qwen
        run: ollama pull qwen3:4b-instruct

      - name: Run DevPulse V3
        env:
          OLLAMA_URL: http://127.0.0.1:11434/api/chat
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ inputs.force_publish }}" = "true" ]; then
            python src/devpulse.py --force
          else
            python src/devpulse.py
          fi

      - name: Detect generated package
        id: generated
        run: |
          if [ -f .devpulse_manifest.json ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "New DevPulse package detected."
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "No package generated in this run."
          fi

      - name: Publish to personal LinkedIn
        id: linkedin
        if: steps.generated.outputs.value == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          LINKEDIN_VERSION: "202608"
        run: python src/linkedin_publish.py

      # Always save generated GitHub work, even if LinkedIn temporarily fails.
      - name: Commit generated content
        if: always()
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "DevPulse Bot"
          git config user.email "devpulse-bot@users.noreply.github.com"

          MSG="chore: update DevPulse"
          if [ -f .devpulse_commit_message ]; then
            MSG="$(cat .devpulse_commit_message)"
            rm .devpulse_commit_message
          fi

          # Manifest is per-run control data; do not persist it.
          rm -f .devpulse_manifest.json

          git add .
          git commit -m "$MSG"
          git push

      - name: DevPulse summary
        if: always()
        run: |
          echo "## DevPulse V3" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generated: ${{ steps.generated.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- LinkedIn step: ${{ steps.linkedin.outcome }}" >> "$GITHUB_STEP_SUMMARY"
