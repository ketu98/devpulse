name: DevPulse Autonomous Publisher

on:
  schedule:
    # Three daily windows.
    # DevPulse itself decides whether the current day/slot is one of the
    # randomly selected 3–4 publishing slots for the week.
    - cron: "17 4 * * *"
    - cron: "43 10 * * *"
    - cron: "29 15 * * *"

  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force a publication on this run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: devpulse-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

          ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid

          echo "Waiting for Ollama to start..."

          for i in {1..30}; do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is ready."
              break
            fi

            sleep 2
          done

      - name: Pull Qwen model
        run: |
          ollama pull qwen3:4b-instruct

      - name: Run DevPulse
        env:
          OLLAMA_URL: http://127.0.0.1:11434/api/chat
        run: |
          if [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "Force publishing enabled."
            python src/devpulse.py --force
          else
            python src/devpulse.py
          fi

      - name: Check whether DevPulse generated a LinkedIn post
        id: linkedin_check
        run: |
          if git status --porcelain linkedin-queue/ | grep -q .; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "New LinkedIn content detected."
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "No new LinkedIn content generated on this run."
          fi

      - name: Publish to LinkedIn
        if: steps.linkedin_check.outputs.generated == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        run: |
          python src/linkedin_publish.py

      - name: Commit generated content
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "DevPulse Bot"
          git config user.email "devpulse-bot@users.noreply.github.com"

          MSG="chore: update DevPulse state"

          if [ -f .devpulse_commit_message ]; then
            MSG="$(cat .devpulse_commit_message)"
            rm .devpulse_commit_message
          fi

          git add .
          git commit -m "$MSG"
          git push

      - name: Workflow summary
        if: always()
        run: |
          echo "## DevPulse Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- Workflow: DevPulse Autonomous Publisher" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.linkedin_check.outputs.generated }}" = "true" ]; then
            echo "- LinkedIn content: Generated" >> "$GITHUB_STEP_SUMMARY"
            echo "- LinkedIn publish step: Attempted" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- LinkedIn content: Not generated on this run" >> "$GITHUB_STEP_SUMMARY"
          fi
